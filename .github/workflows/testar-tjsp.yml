# Teste em massa contra as planilhas oficiais do TJSP ("Extenso" e "Cálculo Simples"), usadas como gabarito.
# Todo mês, depois que o TJSP publica os índices novos (e também quando você clicar em "Run workflow"):
#   1. baixa as planilhas do mês do site do TJSP (se não conseguir, usa as cópias do repositório);
#   2. gera casos aleatórios e calcula cada um nas planilhas, pelo LibreOffice (sem macros);
#   3. calcula os mesmos casos na calculadora e compara, separando correção, juros de 1% e taxa legal.
# O resultado fica no resumo da execução e no arquivo "relatorio-tjsp" (Artifacts).
# Falha se a correção monetária divergir, se a calculadora recusar um caso válido ou se, na planilha Extenso, o
# regime padrão ou a taxa fixa derem total diferente sem ser por uma diferença de critério já conhecida.
name: Testar contra a planilha do TJSP

on:
  schedule:
    - cron: '17 12 6 * *'   # dia 6 de cada mês, 09:17 em Brasília
  workflow_dispatch:
    inputs:
      casos:
        description: 'Quantidade de casos aleatórios'
        default: '500'

permissions:
  contents: read

jobs:
  tjsp:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar o LibreOffice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-calc-nogui python3-uno
      - name: Baixar as planilhas do mês no site do TJSP
        run: python3 ferramentas/tjsp/baixar-planilha.py
      - name: Atualizar índices pelo Banco Central
        run: node ferramentas/atualizar-indices.js
      - name: Calcular os casos nas planilhas do TJSP
        run: |
          /usr/bin/python3 ferramentas/tjsp/gabarito-tjsp.py "${{ github.event.inputs.casos || '500' }}" "${{ github.run_number }}" '' extenso
          /usr/bin/python3 ferramentas/tjsp/gabarito-tjsp.py "${{ github.event.inputs.casos || '500' }}" "${{ github.run_number }}" '' simples
      - name: Comparar com a calculadora (planilha Extenso)
        run: node ferramentas/tjsp/comparar-tjsp.js ferramentas/tjsp/gabarito-extenso.json
      - name: Comparar com a calculadora (planilha Cálculo Simples)
        if: always()
        run: node ferramentas/tjsp/comparar-tjsp.js ferramentas/tjsp/gabarito.json
      - name: Guardar o relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-tjsp
          path: |
            ferramentas/tjsp/relatorio*.md
            ferramentas/tjsp/gabarito*.json
