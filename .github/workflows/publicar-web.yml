# Publicação diária e automática das regras da versão web (GitHub Pages).
# Todo dia, às 06:30 de Brasília: busca os índices no Banco Central, confere com a Tabela Prática embutida,
# confere os totais de referência e só então publica. Se algo divergir, a publicação para e o site continua
# com a versão de ontem. Nada é gravado no repositório: o data.js atualizado vai direto para o site.
#
# Para usar em outro lugar (Azure Static Web Apps, servidor da Defensoria, pacote do SharePoint), mantenha os
# três primeiros passos e troque os dois últimos pelo envio da pasta ao destino.
name: Publicar versão web

on:
  push:
    branches: [main]
    paths:
      - REGRAS-DE-NEGOCIO.md
      - ferramentas/gerar-pagina-regras.js
      - ferramentas/testar-pagina-regras.js
      - ferramentas/testar-pagina-regras-navegador.js
      - package.json
      - package-lock.json
      - .github/workflows/publicar-web.yml
      - calc.html
      - contrato.html
      - compartilhado.css
      - compartilhado.js
      - calc.css
      - tema.js
      - engine.js
      - ui.js
      - data.js
      - indices.js
      - copilot.js
      - contrato/**
      - ferramentas/testar-site.js
  schedule:
    - cron: '30 9 * * *'   # 09:30 UTC = 06:30 em Brasília
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publicar-web
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Conferir página das regras
        run: npm run testar-pagina-regras
      - name: Preparar navegador
        run: npx playwright install --with-deps chromium
      - name: Conferir página das regras no navegador
        run: npm run testar-pagina-regras-navegador
      - name: Atualizar índices pelo Banco Central
        run: node ferramentas/atualizar-indices.js
      - name: Atualizar séries BACEN de contratos
        run: node ferramentas/atualizar-series-contrato.js
      - name: Conferir totais de referência
        run: npm test
      - name: Montar o site
        run: |
          mkdir -p _site
          cp calc.html index.html
          cp -r index.html calc.html calc.css compartilhado.css compartilhado.js tema.js data.js indices.js engine.js copilot.js ui.js contrato.html contrato icons fonts _site/
          npm run gerar-pagina-regras
      - name: Conferir o site montado (as duas calculadoras, com um total conhecido em cada)
        run: npm run testar-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
